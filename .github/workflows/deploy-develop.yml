name: Frontend Deploy Dev

on:
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: frontendVersion2React
        run: npm ci

      - name: Build Project
        working-directory: frontendVersion2React
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: frontendVersion2React/dist/

  deploy-dev:
    needs: build
    uses: ./.github/workflows/ftp-deploy.yml
    secrets: inherit
    with:
      environment: dev
      artifact-name: app-build
