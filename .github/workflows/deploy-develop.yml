name: Frontend Deploy Dev

on:
  push:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: frontendVersion2React
        run: npm ci

      - name: Inject API_URL
        shell: bash
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          set -e
          FILE="frontendVersion2React/src/services/config.js"
          SAFE_API="${API_URL//&/\\&}"
          sed -i 's|\${API_URL}|'"$SAFE_API"'|g' "$FILE"

      - name: Build Project
        working-directory: frontendVersion2React
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: frontendVersion2React/dist/

  deploy-dev:
    needs: build
    uses: ./.github/workflows/ftp-deploy.yml
    secrets: inherit
    with:
      environment: dev
      artifact-name: app-build
